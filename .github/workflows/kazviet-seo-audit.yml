name: KAZVIET multilingual SEO build audit

on:
  push:
    paths:
      - 'kazviet/**'
      - '.github/workflows/kazviet-seo-audit.yml'
  workflow_dispatch:

jobs:
  validate-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile SEO build scripts
        run: python3 -m py_compile kazviet/deploy/build-production.py kazviet/deploy/seo-enhance.py
      - name: Build isolated production site and run audit
        run: python3 kazviet/deploy/build-production.py --source kazviet --output /tmp/kazviet-production
      - name: Verify every page, all language alternates and buyer pages
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = Path('/tmp/kazviet-production')
          verification = {"googlead3cfb8a1f2aa625.html", "yandex_ae34fa82fbd7f2f3.html", "BingSiteAuth.xml"}
          for filename in verification:
              assert (root / filename).read_bytes() == (Path('kazviet') / filename).read_bytes(), filename
          pages = sorted(p for p in root.rglob('*.html') if p.relative_to(root).as_posix() not in verification)
          assert len(pages) >= 106, len(pages)
          links = set()
          by_path = {}
          for page in pages:
              p = '/' if page == root / 'index.html' else '/' + page.relative_to(root).parent.as_posix() + '/'
              links.add('https://kazviet.asia' + p)
              by_path[p] = page.read_text(encoding='utf-8')
          for p, html in by_path.items():
              assert len(re.findall(r'<h1\b', html, re.I)) == 1, p
              assert html.count('rel="canonical"') == 1, p
              assert f'href="https://kazviet.asia{p}"' in html, p
              assert 'modulnydom.github.io/kazviet' not in html, p
              assert '"@type":"Organization"' in html, p
              for dest in re.findall(r'<link\s+rel="alternate"\s+hreflang="(?:ru|en|vi|kk)"\s+href="([^"]+)"', html):
                  assert dest in links, (p,dest)
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9', 'x': 'http://www.w3.org/1999/xhtml'}
          tree = ET.parse(root/'sitemap.xml')
          urls = {node.findtext('s:loc',namespaces=ns) for node in tree.findall('s:url', ns)}
          assert urls == links, (len(urls), len(links))
          for loc in urls:
              p = loc.removeprefix('https://kazviet.asia')
              html = by_path[p]
              assert 'name="robots"' in html, p
              assert html.count('https://mc.yandex.ru/metrika/tag.js?id=114717615') == 1, p
              assert html.count("ym(114717615, 'init'") == 1, p
              assert html.count('https://mc.yandex.ru/watch/114717615') == 1, p
              assert re.search(r'<head\b[^>]*>.*?mc\.yandex\.ru/metrika/tag\.js\?id=114717615.*?</head>', html, re.I | re.S), p
              assert re.search(r'<body\b[^>]*>\s*<noscript>.*?mc\.yandex\.ru/watch/114717615.*?</noscript>', html, re.I | re.S), p
          for lang in ('ru','en','kk'):
              assert f'/{lang}/products/vietnam-plywood/' in by_path
              assert f'/{lang}/suppliers/vietnam/tt-plywood/' in by_path
              assert 'kv-b2b-checklist' in by_path[f'/{lang}/products/vietnam-plywood/'], lang
              assert 'kv-evidence' in by_path[f'/{lang}/suppliers/vietnam/tt-plywood/'], lang
          for lang in ('ru','en','kk'):
              for slug in ('coffee','dried-fruit','cashew','black-pepper','ginger','confectionery','beverages','noodles','tapioca-starch','rice'):
                  p = f'/{lang}/products/vietnam-{slug}/'
                  assert p in by_path, p
                  assert 'id="enquiry"' in by_path[p], p
                  assert 'support@kazviet.asia' in by_path[p], p
                  assert 'href="/' + lang + '/products/vietnam-' + slug + '/"' in by_path[f'/{lang}/'], p
          home = by_path['/']
          assert 'id="kvHomeWhy"' in home
          assert 'href="/ru/"' in home
          assert 'href="/ru/?country=vietnam"' in home
          assert 'href="/ru/?country=kazakhstan"' in home
          assert 'href="/#catalog"' not in home
          assert not re.search(r'<link[^>]+hreflang="(?:ru|en|kk|x-default)"', home)
          for lng in ('ru', 'en', 'kk'):
              assert 'hreflang="x-default" href="https://kazviet.asia/ru/"' in by_path[f'/{lng}/']
          assert all(not path.startswith('/vi/') for path in by_path)
          assert not (root/'vi').exists()
          assert (root/'favicon.svg').is_file()
          assert (root/'site.webmanifest').is_file()
          for p, html in by_path.items():
              assert 'rel="icon" type="image/svg+xml" href="/favicon.svg"' in html, p
              assert 'rel="manifest" href="/site.webmanifest"' in html, p
              assert not re.search(r'<link[^>]+hreflang="vi"', html, re.I), p
              assert 'href="/vi/' not in html and 'href="https://kazviet.asia/vi/' not in html, p
          print('SUCCESS:', len(pages), 'indexed HTML pages; three locales; Vietnamese market temporarily disabled')
          PY
